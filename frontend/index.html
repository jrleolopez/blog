<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Blog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="custom-navbar mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="index.html">Mi Blog</a>
      <button id="menu-toggle" class="navbar-toggler" type="button" onclick="toggleMenu()" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="menu" class="navbar-collapse">
        <ul id="navLinks" class="navbar-nav"></ul>
      </div>
    </div>
  </nav>
  <main class="container mb-5 flex-grow-1">
    <h1 class="mb-4">Posts recientes</h1>
    <div id="posts" class="row g-3"></div>
    <div id="pagination" class="d-flex justify-content-center mt-4"></div>
  </main>
  <footer class="custom-footer mt-auto text-center py-3">
    <p class="mb-0">&copy; 2026 Mi Blog - Desarrollado por Leonardo</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Tu lógica -->
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderNavbar();
      loadPosts();
    });
  </script>
</body>
</html>
