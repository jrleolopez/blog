<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear cuenta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="custom-navbar">
    <div class="navbar-container">
      <a class="navbar-brand" href="index.html">Mi Blog</a>
      <div id="menu-toggle" class="menu-toggle" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </div>
      <div id="menu" class="navbar-collapse">
        <ul id="navLinks" class="navbar-nav"></ul>
      </div>
    </div>
  </nav>

  <main class="main-container centered-container">
    <div class="form-card register-card">
      <div class="card-header custom-card-header">
        <h4>Crear cuenta</h4>
      </div>
      <div class="card-body">
        <form id="registerForm">
          <div class="form-group">
            <label for="firstName">Nombre</label>
            <input type="text" id="firstName" class="form-control" placeholder="Tu nombre" required>
            <small class="error-message">El nombre es obligatorio.</small>
          </div>
          <div class="form-group">
            <label for="lastName">Apellido</label>
            <input type="text" id="lastName" class="form-control" placeholder="Tu apellido" required>
            <small class="error-message">El apellido es obligatorio.</small>
          </div>
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required>
            <small class="error-message">Ingresa un correo válido.</small>
          </div>
          <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" class="form-control" placeholder="Elige un usuario" required>
            <small class="error-message">El usuario es obligatorio.</small>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="Elige una contraseña segura" required>
            <small class="error-message">La contraseña es obligatoria.</small>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Repite tu contraseña" required>
            <small class="error-message">Debes confirmar tu contraseña.</small>
          </div>
          <button type="submit" class="btn-form">Registrarse</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="custom-footer">
    <p>&copy; 2026 Mi Blog - Desarrollado por Leonardo</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
