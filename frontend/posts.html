<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear nuevo post</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="custom-navbar mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="index.html">Mi Blog</a>
      <div id="menu-toggle" class="menu-toggle" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </div>
      <div id="menu" class="navbar-collapse">
        <ul id="navLinks" class="navbar-nav"></ul>
      </div>
    </div>
  </nav>
  <main class="container d-flex justify-content-center">
    <div class="card shadow-sm register-post">
      <!-- Encabezado -->
      <div class="card-header custom-card-header">
        <h4 class="mb-0">Crear nuevo post</h4>
      </div>
      <div class="card-body">
        <form id="postForm">
          <div class="mb-3">
            <label for="title" class="form-label">Título</label>
            <input type="text" id="title" class="form-control" placeholder="Título" required>
          </div>
          <div class="mb-3 form-group">
            <label for="category">Categoría</label>
            <select id="category" class="form-select" required>
              <option value="">Selecciona una categoría</option>
              <option value="Tecnología">Tecnología</option>
              <option value="Noticias">Noticias</option>
              <option value="Tutorial">Tutorial</option>
            </select>
          </div>
          <div class="mb-3 form-group">
            <label for="image">Imagen destacada</label>
            <input type="file" id="image" name="image" class="form-control" accept="image/*">
          </div>
          <div class="mb-3">
            <label for="content" class="form-label">Contenido</label>
            <textarea id="content" class="form-control" placeholder="Contenido" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-form w-100">Publicar</button>
        </form>
      </div>
    </div>
  </main>
  <footer class="custom-footer">
    <small>&copy; 2026 Mi Blog - Desarrollado por Leonardo</small>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
