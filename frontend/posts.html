<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Crear nuevo post</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tus estilos personalizados -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="custom-navbar">
      <div class="navbar-container">
        <a class="navbar-brand" href="index.html">Mi Blog</a>
        <div id="menu-toggle" class="menu-toggle" onclick="toggleMenu()">
          <span></span><span></span><span></span>
        </div>
        <div id="menu" class="navbar-collapse">
          <ul id="navLinks" class="navbar-nav"></ul>
        </div>
      </div>
    </nav>

    <main class="main-container centered-container">
      <div class="form-card register-post">
        <div class="card-header custom-card-header">
          <h4>Crear nuevo post</h4>
        </div>
        <div class="card-body">
          <form id="postForm">
            <div class="form-group">
              <label for="title">Título</label>
              <input
                type="text"
                id="title"
                name="title"
                class="form-control"
                placeholder="Título"
                required
              />
            </div>
            <div class="form-group">
              <label for="category">Categoría</label>
              <select
                id="category"
                name="category"
                class="form-control"
                required
              >
                <option value="">Selecciona una categoría</option>
                <option value="Tecnología">Tecnología</option>
                <option value="Noticias">Noticias</option>
                <option value="Tutorial">Tutorial</option>
              </select>
            </div>
            <div class="form-group">
              <label for="image">Imagen destacada</label>
              <input
                type="file"
                id="image"
                name="image"
                class="form-control"
                accept="image/*"
              />
            </div>
            <div class="form-group">
              <label for="content">Contenido</label>
              <textarea
                id="content"
                name="content"
                class="form-control"
                placeholder="Contenido"
                rows="4"
                required
              ></textarea>
            </div>
            <button type="submit" class="btn-form">Publicar</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="custom-footer">
      <small>&copy; 2026 Mi Blog - Desarrollado por Leonardo</small>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
