<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear nuevo post</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap solo para grid y utilidades -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tus estilos personalizados -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="custom-navbar">
    <div class="navbar-container">
      <a class="navbar-brand" href="index.html">Mi Blog</a>
      <div id="menu-toggle" class="menu-toggle" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </div>
      <div id="menu" class="navbar-collapse">
        <ul id="navLinks" class="navbar-nav"></ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container d-flex justify-content-center">
    <div class="custom-card register-post">
      <div class="custom-card-header">
        <h4>Crear nuevo post</h4>
      </div>
      <div class="card-body">
        <form id="postForm" enctype="multipart/form-data">
          <div class="form-group mb-3">
            <label for="title">Título</label>
            <input type="text" id="title" class="form-control" placeholder="Título" required />
          </div>
          <div class="form-group mb-3">
            <label for="category">Categoría</label>
            <select id="category" class="form-select" required>
              <option value="">Selecciona una categoría</option>
              <option value="Tecnología">Tecnología</option>
              <option value="Noticias">Noticias</option>
              <option value="Tutorial">Tutorial</option>
            </select>
          </div>
          <div class="form-group mb-3">
            <label for="image">Imagen destacada</label>
            <input type="file" id="image" name="image" class="form-control" accept="image/*" />
          </div>
          <div class="form-group mb-3">
            <label for="content">Contenido</label>
            <textarea id="content" class="form-control" placeholder="Contenido" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn-form">Publicar</button>
        </form>

        <!-- Vista previa -->
        <div id="preview" class="preview d-none mt-4">
          <h5>Vista previa del post</h5>
          <div class="preview-card p-3">
            <img id="preview-img" class="mb-3" style="max-height:200px; object-fit:cover;">
            <h4 id="preview-title"></h4>
            <span id="preview-category" class="preview-badge"></span>
            <p id="preview-content"></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="custom-footer mt-auto">
    <small>&copy; 2026 Mi Blog - Desarrollado por Leonardo</small>
  </footer>

  <!-- SCRIPTS -->
  <script src="js/app.js"></script>
</body>
</html>
