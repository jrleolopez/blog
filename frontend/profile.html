<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil de usuario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tus estilos personalizados -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="custom-navbar">
    <div class="navbar-container">
      <a class="navbar-brand" href="index.html">Mi Blog</a>
      <div id="menu-toggle" class="menu-toggle" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </div>
      <div id="menu" class="navbar-collapse">
        <ul id="navLinks" class="navbar-nav"></ul>
      </div>
    </div>
  </nav>

  <main class="main-container profile-wrapper">
    <div class="form-profile">
      <div class="card-body profile-body" id="profile">
      </div>
    <div class="form-card">
      <div class="card-header custom-card-header">
        <h4>Editar perfil</h4>
      </div>
      <div class="card-body">
        <form id="editProfileForm" enctype="multipart/form-data">
          <div class="form-group">
            <label for="bio">Biografía</label>
            <textarea id="bio" name="bio" class="form-control" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="avatar">Subir Avatar</label>
            <input type="file" id="avatar" name="avatar" class="form-control" accept="image/*">
          </div>
          <button type="submit" class="btn-form">Actualizar</button>
        </form>
      </div>
    </div>
    </div>
  </main>

  <footer class="custom-footer">
    <p>&copy; 2026 Mi Blog - Desarrollado por Leonardo</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
